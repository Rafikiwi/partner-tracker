const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const bu=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
async function derive(pw){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(P.s),iterations:P.it,hash:'SHA-256'},k,{name:'AES-GCM',length:256},true,['decrypt']);}
async function show(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(P.iv)},key,ub(P.ct));
 const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();}
(async()=>{try{const r=JSON.parse(localStorage.getItem('pt_key')||'null');
 if(r&&r.s===P.s){const key=await crypto.subtle.importKey('raw',ub(r.k),{name:'AES-GCM'},true,['decrypt']);await show(key);}}
 catch(e){try{localStorage.removeItem('pt_key')}catch(_){}}})();
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const go=document.getElementById('go'),err=document.getElementById('err');
 go.disabled=true;go.textContent='Opening…';err.textContent='';
 try{const key=await derive(document.getElementById('pw').value);
  let raw=null;if(document.getElementById('rem').checked)raw=bu(await crypto.subtle.exportKey('raw',key));
  await show(key);if(raw)try{localStorage.setItem('pt_key',JSON.stringify({s:P.s,k:raw}))}catch(_){}}
 catch(x){err.textContent='Wrong password.';go.disabled=false;go.textContent='Open';}};
</script></body></html>
